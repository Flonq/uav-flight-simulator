<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>UAV Flight Simulator</title>
<desc>Technical portfolio project built in Unity 6.3 LTS and C#.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430"><stop stop-color="#06080C"/><stop offset="1" stop-color="#0A0E15"/></linearGradient>
  <radialGradient id="cyan" cx="0" cy="0" r="1" gradientTransform="translate(260 130) rotate(25) scale(300 180)"><stop stop-color="#7DEBFF" stop-opacity=".22"/><stop offset="1" stop-color="#7DEBFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="blue" cx="0" cy="0" r="1" gradientTransform="translate(960 110) rotate(155) scale(330 190)"><stop stop-color="#5A8CFF" stop-opacity=".18"/><stop offset="1" stop-color="#5A8CFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="edge" x1="60" y1="45" x2="1140" y2="385"><stop stop-color="#DDFBFF" stop-opacity=".42"/><stop offset=".48" stop-color="#7DEBFF" stop-opacity=".16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".07"/></linearGradient>
  <linearGradient id="title" x1="90" y1="165" x2="720" y2="230"><stop stop-color="#FFFFFF"/><stop offset=".58" stop-color="#E6EBF2"/><stop offset="1" stop-color="#9AA6B8"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="430" rx="32" fill="url(#bg)"/>
<rect width="1200" height="430" rx="32" fill="url(#cyan)"/>
<rect width="1200" height="430" rx="32" fill="url(#blue)"/>
<rect x="38.75" y="38.75" width="1122.5" height="352.5" rx="26.25" fill="#FFFFFF" fill-opacity=".018" stroke="url(#edge)" stroke-width="1.5"/>

<g opacity=".12" stroke="#8FA1B5" stroke-width="1">
  <line x1="760" y1="80" x2="1110" y2="80"/><line x1="760" y1="115" x2="1110" y2="115"/><line x1="760" y1="150" x2="1110" y2="150"/><line x1="760" y1="185" x2="1110" y2="185"/><line x1="760" y1="220" x2="1110" y2="220"/><line x1="760" y1="255" x2="1110" y2="255"/><line x1="760" y1="290" x2="1110" y2="290"/>
  <line x1="800" y1="65" x2="800" y2="315"/><line x1="855" y1="65" x2="855" y2="315"/><line x1="910" y1="65" x2="910" y2="315"/><line x1="965" y1="65" x2="965" y2="315"/><line x1="1020" y1="65" x2="1020" y2="315"/><line x1="1075" y1="65" x2="1075" y2="315"/>
</g>

<path d="M785 265 C842 220 862 158 932 147 C1001 136 1035 173 1090 118" stroke="#7DEBFF" stroke-opacity=".50" stroke-width="1.5" stroke-dasharray="7 8"/>
<circle r="4" fill="#7DEBFF" filter="url(#glow)">
  <animateMotion dur="7s" repeatCount="indefinite" path="M785 265 C842 220 862 158 932 147 C1001 136 1035 173 1090 118"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="7s" repeatCount="indefinite"/>
</circle>

<text x="82" y="86" fill="#8EA0B3" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="11" letter-spacing="2.4">FLONQ / SIMULATION PROJECT</text>
<text x="1116" y="86" text-anchor="end" fill="#718094" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="10" letter-spacing="1.8">UNITY 6.3 LTS / C#</text>

<text x="82" y="183" fill="url(#title)" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing=".5">UAV FLIGHT SIMULATOR</text>
<text x="84" y="224" fill="#BCC8D6" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="15" letter-spacing="2.4">FIXED-WING · PHYSICS · TELEMETRY · MISSION SYSTEMS</text>
<text x="84" y="278" fill="#9AA7B7" font-family="Segoe UI, Arial, sans-serif" font-size="16">A modular desktop flight-simulation portfolio project built system by system.</text>
<text x="84" y="305" fill="#778496" font-family="Segoe UI, Arial, sans-serif" font-size="14">Focused on explainable architecture, physics-driven control and a complete mission loop.</text>

<g transform="translate(84 344)">
  <circle cx="7" cy="7" r="4" fill="#7DEBFF" filter="url(#glow)"><animate attributeName="opacity" values=".4;1;.4" dur="2.5s" repeatCount="indefinite"/></circle>
  <text x="25" y="11" fill="#AEBAC8" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="10" letter-spacing="1.7">CURRENT PHASE · 05 / ENGINE &amp; THROTTLE</text>
</g>
<text x="1116" y="355" text-anchor="end" fill="#687789" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="10" letter-spacing="1.7">WINDOWS · KEYBOARD / GAMEPAD · URP</text>
</svg>